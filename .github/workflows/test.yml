name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Unit and end-to-end tests
        run: node --test test/export.test.mjs test/codex.test.mjs test/setup.test.mjs
      - name: CLI entry point
        run: |
          node bin/unabridged.mjs --version
          node bin/unabridged.mjs --help
          node bin/unabridged.mjs setup --list
      - name: Build the desktop extension
        run: node scripts/build-mcpb.mjs

  installers:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install.sh (this commit)
        if: runner.os != 'Windows'
        env:
          UNABRIDGED_REF: ${{ github.sha }}
          UNABRIDGED_NO_SETUP: '1'
        run: |
          bash install.sh
          "$HOME/.local/bin/unabridged" --version
          "$HOME/.local/bin/unabridged" --list --all
      - name: install.ps1 in PowerShell 7 (this commit)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          UNABRIDGED_REF: ${{ github.sha }}
          UNABRIDGED_NO_SETUP: '1'
        run: |
          ./install.ps1
          & "$env:LOCALAPPDATA\unabridged\bin\unabridged.cmd" --version
          & "$env:LOCALAPPDATA\unabridged\bin\unabridged.cmd" --list --all
      - name: install.ps1 in Windows PowerShell 5.1 (this commit)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          UNABRIDGED_REF: ${{ github.sha }}
          UNABRIDGED_NO_SETUP: '1'
        run: |
          ./install.ps1
          & "$env:LOCALAPPDATA\unabridged\bin\unabridged.cmd" --version
      - name: npx from the GitHub tarball (this commit)
        run: npx -y "https://github.com/${{ github.repository }}/archive/${{ github.sha }}.tar.gz" --version

  homebrew:
    needs: test
    runs-on: macos-latest
    steps:
      - name: brew install from the tap (latest release)
        run: |
          brew tap saieeshb/tap
          brew trust saieeshb/tap 2>/dev/null || true
          brew install unabridged
          unabridged --version
          brew test unabridged
